<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.svg">
  <title>妙搭</title>
  <script>
    try {
      window.__platform__ = JSON.parse('{{{__platform__}}}');
      // 外部独立部署时，需要把 csrfToken 暴露到 window，供 axios 拦截器设置请求头
      window.csrfToken = window.__platform__.csrfToken;
    } catch (e) {
      console.error('Failed to parse __platform__', e);
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/client/src/index.tsx"></script>
</body>

</html>

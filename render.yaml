# Render Blueprint —— 东盟智贸 ASEAN-Go 一键部署（最简单，全部由 Render 托管）
# 部署后获得正式地址：https://asean-go.onrender.com

databases:
  - name: asean-go-db
    plan: free
    databaseName: aseango
    user: aseango

services:
  - type: web
    name: asean-go
    runtime: node
    plan: free
    buildCommand: bash scripts/build-deploy.sh
    startCommand: node dist/server/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUDA_DATABASE_URL
        fromDatabase:
          name: asean-go-db
          property: connectionString
      # 平台 HTTP 客户端构造时需要基础域名；业务代码不调用平台内部 API，用本机占位即可
      - key: FORCE_AUTHN_INNERAPI_DOMAIN
        value: http://127.0.0.1:3000
